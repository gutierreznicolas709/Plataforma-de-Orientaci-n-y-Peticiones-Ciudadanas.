<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Plataforma de Peticiones</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main>
    <h1>Ingreso a la Plataforma</h1>

    <p class="aviso">
      Este ingreso es de práctica. No use correos ni contraseñas reales.
    </p>

    <section>
      <h2>Usuarios de práctica</h2>
      <ul>
        <li>ciudadano@example.com / 123456</li>
        <li>revisor@example.com / 123456</li>
        <li>admin@example.com / 123456</li>
      </ul>
    </section>

    <form id="formLogin">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">Ingresar</button>
    </form>

    <section>
      <h2>Resultado</h2>
      <div id="resultadoLogin">Ingrese con un usuario de práctica.</div>
    </section>

    <p>
      <a href="/peticion.html">Volver al formulario de petición</a>
    </p>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
